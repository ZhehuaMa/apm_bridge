custom_link_bridge:
  ros__parameters:
    gravity_const: 9.80665
    mass: 2.0
    voltage_compensation: false
    baro_compensation: false
    channel_trigger: 7 # CH8 / AUX4, zero-based; matches sitl_joystick.py.
    battery.capacity_mah: 0.0
    gimbal_port: ""
    gimbal:
      mission_on_ground: true
      model: "C20S"
      pitch_aim: 10.0 # AIM is -80 deg body-relative pitch (= -90 + pitch_aim, ROS FLU: up = -90 deg).
      pitch_mission_min: -20.0 # MISSION joint window [-90+min, -90+max] = [-110, -20] deg.
      pitch_mission_max: 70.0
      pitch_travel_min: -120.0
      pitch_travel_max: 120.0
      pitch_hold: 0.0 # HORIZON alone: positive nose-up, degrees. MISSION centers LOS at zero.
      tracking_gain: 2.0
      tracking_max_rate: 150.0 # deg/s, per actuated axis; the single per-axis speed cap for MISSION tracking and HORIZON leveling (absorbs the former max_angle_speed).
      tracking_max_accel: 600.0 # deg/s^2.
      tracking_filter_tau: 0.12 # seconds.
      los_timeout: 0.5 # seconds; tracker LOS stamps lag up to ~0.35 s under load — at 0.3 the MISSION gimbal intermittently drops to locked-hold and a fast target spirals it out of frame
      roll_hold_enter: 75.0
      roll_hold_exit: 70.0

    # Measured on 2026-10-10: 42 steady-state samples, 2 repeats, collective 0.08..0.50
    # (data: sitl_motor_calibration.csv). Fitted with the fpv_test.md model: zero-intercept
    # cubic F_std(u) = a3*u^3 + a2*u^2 + a1*u over the DShot duty u = 0.055 + 0.945*collective
    # (sitl_motor_calibration --fit): R^2=0.99998, max throttle error 0.0016, hover collective 0.1732.
    # AirSim has no baro/voltage sag/RPM feedback: both compensations stay disabled, r_eq = k_i = 0.
    # u_idle is read from the SITL firmware at link-up (CLI "get motor_idle", default 550 = 0.055).
    # Recalibrate after changing the vehicle, PWM endpoints or simulation environment.
    motor_parameters:
      a3: -1.3910762188770394
      a2: -0.5510910291316834
      a1: 89.87610919170108
      r_eq: 0.0
      k_i: 0.0

    airsim:
      enabled: true
      host: "127.0.0.1"
      port: 41451
      vehicle_name: "Copter"
      timeout: 1.0
      link_bind_host: "127.0.0.1"
      link_port: 5764 # AirSim connects here; only this node connects to FC 5763.
      camera_name: "0"
      gimbal_enabled: true
    link:
      transport: "tcp"
      tcp_host: "127.0.0.1"
      tcp_port: 5763
      control_rate: 100.0 # Latest-command cache push and 0x20 transmit frequency (Hz).
      sync_rate: 1.0
      diag_rate: 0.2
      rate_limit_dps: 0.0
      angle_limit_deg: 0.0 # Client-side ANGLE-mode roll/pitch clamp (deg, 0 = unlimited).
    rc:
      control_timeout: 0.5
    landed:
      airborne_altitude: 0.1
      landing_altitude: 0.05
      takeoff_confirm_time: 0.5
      landing_confirm_time: 1.0
    imu:
      frame_id: "base_link"
